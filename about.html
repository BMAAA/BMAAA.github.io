<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var parts = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
        var root = { "index.html": 1, about: 1, "about.html": 1, "leather-color": 1, "leather-color.html": 1 };
        var base = "/";
        if (parts.length && !root[parts[0]]) base = "/" + parts[0] + "/";
        document.write('<base href="' + location.origin + base + '">');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bmaaa.github.io — о сайте</title>
    <meta name="description" content="Личный сайт bmaaa: реестр ТЗ и калькулятор красителей для PepeLand." />
    <meta name="theme-color" content="#14b8a6" />
    <meta property="og:title" content="bmaaa.github.io — инструменты ППЛ" />
    <meta property="og:description" content="Кто, зачем и кому спасибо." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icons/icon-512.png" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="application">
      <article class="about-page">
        <div class="about-stack">
          <section class="about-panel about-intro">
            <h1 data-i18n="about_title">О сайте</h1>
            <p class="about-body" data-i18n="about_body">
              Этот сайт — личный проект для PepeLand.
            </p>
          </section>

          <section class="about-panel about-thanks" aria-labelledby="about-thanks-title">
            <h2 id="about-thanks-title" class="about-panel-title" data-i18n="about_thanks">Благодарности</h2>
            <ul class="about-thanks-list">
              <li class="about-thanks-item">
                <span class="about-thanks-name">TheEvilM</span>
                <span class="about-thanks-note" data-i18n="about_thanks_evilm">за моральную поддержку и слова «всё херня давай по новой»</span>
              </li>
              <li class="about-thanks-item">
                <span class="about-thanks-name">ChipZik</span>
                <span class="about-thanks-note" data-i18n="about_thanks_chipzik">за проверку реестра и нахождение некоторых моих затупов</span>
              </li>
              <li class="about-thanks-item">
                <span class="about-thanks-name">FanyaOff</span>
                <span class="about-thanks-note" data-i18n="about_thanks_fanya">за помощь с оптимизацией реестра</span>
              </li>
            </ul>
          </section>
        </div>
      </article>
    </main>
    <script src="scripts/base.js"></script>
    <script src="scripts/i18n.js" defer></script>
    <script src="scripts/layout.js" defer></script>
    <script src="scripts/placeholders.js" defer></script>
    <script src="scripts/daily_jokes.js" defer></script>
  </body>
</html>
