<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var parts = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
        var root = { "index.html": 1, about: 1, "about.html": 1, "leather-color": 1, "leather-color.html": 1 };
        var base = "/";
        if (parts.length && !root[parts[0]]) base = "/" + parts[0] + "/";
        document.write('<base href="' + location.origin + base + '">');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bmaaa.github.io — реестр ТЗ ППЛ</title>
    <meta name="description" content="Реестр торговой зоны ППЛ11: категории, id, поиск по предметам." />
    <meta name="theme-color" content="#14b8a6" />
    <meta property="og:title" content="bmaaa.github.io — реестр ТЗ" />
    <meta property="og:description" content="Реестр торговой зоны ППЛ11 без лишней суеты." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icons/icon-512.png" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preload" href="data/items.json" as="fetch" crossorigin />
    <link rel="preload" href="data/atlases/items_atlas.json" as="fetch" crossorigin />
    <link rel="preload" href="assets/atlases/cur.webp" as="image" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!-- Затемнение при открытом мобильном меню -->
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="application">
      <section class="catalogue" id="catalogue">
        <div class="registry-toolbar">
          <div class="registry-toolbar-main">
            <div class="registry-heading">
              <h2 data-i18n="section_registry">Реестр торговой зоны</h2>
              <span class="section-label" data-i18n="section_label">PPL 11</span>
            </div>
            <div class="item-counter" id="itemCounter">...</div>
          </div>
          <div class="category-filters-row">
            <div class="category-filters" id="categoryFilters"></div>
            <button
              type="button"
              class="sales-filter-toggle"
              id="salesFilterToggle"
              aria-pressed="false"
              data-i18n="sales_filter"
              data-i18n-title="sales_filter_tip"
              title="Убрать не продаваемые предметы"
            >
              Фильтр продаж
            </button>
          </div>
          <div
            class="sales-filter-warning"
            id="salesFilterWarning"
            role="status"
            aria-live="polite"
            hidden
          ></div>
        </div>
        <div class="categories-container" id="categoriesContainer">
          <div class="loading">
            <div class="loader"></div>
            <p data-i18n="loading_items">Загрузка предметов...</p>
          </div>
        </div>
      </section>
    </main>
    <!-- =====================================================
     МОДАЛЬНОЕ ОКНО ПРЕДМЕТА
====================================================== -->

    <div class="modal" id="itemModal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-background"></div>
      <article class="modal-content" tabindex="-1">
        <button class="modal-close" id="modalClose" type="button" data-i18n-aria="aria_close" aria-label="Закрыть">×</button>
        <header class="modal-header">
          <div class="modal-icon-frame">
            <img id="modalImage" src="" alt="" />
          </div>
          <div class="modal-header-text">
            <h2 id="modalName">Название предмета</h2>
            <span class="modal-category-badge" id="modalCategoryFull">Категория</span>
          </div>
        </header>
        <div class="modal-fields">
          <div class="modal-field">
            <span class="modal-field-key" data-i18n="modal_id">ID</span>
            <code class="modal-field-value" id="modalId">{ITEM_ID}</code>
            <button class="copy-button" id="copyIdBtn" type="button" data-i18n="modal_copy_id">Копировать</button>
          </div>
          <div class="modal-field">
            <span class="modal-field-key" data-i18n="modal_name">Название</span>
            <span class="modal-field-value" id="modalNameValue"></span>
            <button class="copy-button" id="copyNameBtn" type="button" data-i18n="modal_copy_name">Копировать</button>
          </div>
          <div class="modal-field modal-field-action">
            <span class="modal-field-key" data-i18n="modal_wiki">Вики</span>
            <a id="modalWiki" class="copy-button modal-wiki-button" href="#" target="_blank" rel="noopener" data-i18n="modal_wiki_open">Открыть</a>
          </div>
        </div>
        <div class="modal-history" id="modalHistory" hidden>
          <h3 data-i18n="modal_history">Недавно</h3>
          <div class="modal-history-list" id="modalHistoryList"></div>
        </div>
      </article>
    </div>
    <div class="floating-search" id="floatingSearch">
      <div class="floating-search-panel" id="floatingSearchPanel">
        <input
          type="text"
          id="searchInput"
          class="srch"
          data-i18n-placeholder="srch"
          placeholder="Поиск предмета..."
          autocomplete="off"
          enterkeyhint="search"
        />
        <button class="clear-search" id="clearSearch" type="button" data-i18n-aria="aria_clear_search" aria-label="Clear">×</button>
      </div>
      <button
        class="floating-search-toggle"
        id="searchToggle"
        type="button"
        data-i18n-aria="aria_search"
        aria-label="Search"
        aria-expanded="false"
        aria-controls="searchInput"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M10.8 4a6.8 6.8 0 1 0 0 13.6
                      6.8 6.8 0 0 0 0-13.6Zm0-2
                      a8.8 8.8 0 1 1 0 17.6
                      A8.8 8.8 0 0 1 10.8 2Zm7.3
                      15.1 4.3 4.3-1.4 1.4-4.3-4.3
                      1.4-1.4Z"
          />
        </svg>
      </button>
    </div>
    <script src="scripts/base.js"></script>
    <script src="scripts/i18n.js" defer></script>
    <script src="scripts/layout.js" defer></script>
    <script src="scripts/placeholders.js" defer></script>
    <script src="scripts/daily_jokes.js" defer></script>
    <script src="scripts/indexes.js" defer></script>
    <script src="scripts/script_registry.js" defer></script>
  </body>
</html>
